map $uri $admin_login_limit_key {
    default "";
    /api/admin/login $binary_remote_addr;
}
limit_req_zone $admin_login_limit_key zone=admin_login:1m rate=5r/m;

server {
    listen 80;
    server_name car-scan.ru www.car-scan.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name car-scan.ru www.car-scan.ru;

    ssl_certificate /etc/ssl/car-scan.ru.crt;
    ssl_certificate_key /etc/ssl/car-scan.ru.key;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout   70;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    location = /promo {
        try_files /promo.html =404;
    }

    location = /promo2 {
        try_files /promo2.html =404;
    }

    location = /promo2.html {
        absolute_redirect off;
        return 301 /promo2$is_args$args;
    }

    location = /promo2/ {
        absolute_redirect off;
        return 301 /promo2$is_args$args;
    }

    location = /privacy.html {
        try_files /privacy.html =404;
    }

    location = /terms.html {
        try_files /terms.html =404;
    }

    location = /admin/analysis {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /icons/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        limit_req zone=admin_login burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
