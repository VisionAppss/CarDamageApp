<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Carscan — Аналитика</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafafa; color: #1a1a1a;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  #state { padding: 16px; border-radius: 8px; background: #fff; border: 1px solid #eee; max-width: 480px; }
  #state.error { border-color: #f5c2c2; background: #fff5f5; color: #b42323; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
  .card {
    background: #fff; border: 1px solid #eee; border-radius: 10px;
    padding: 16px; overflow-x: auto;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #f0f0f0; }
  th { color: #888; font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .empty { color: #aaa; font-size: 13px; padding: 8px 0; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  input {
    font: inherit; padding: 9px 12px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; color: inherit; width: 100%;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .topbar button { font-size: 12px; padding: 6px 10px; }
  #loginBox {
    max-width: 340px; background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 24px;
  }
  #loginBox h2 { font-size: 16px; margin: 0 0 4px; }
  #loginBox .hint { color: #888; font-size: 12.5px; margin-bottom: 16px; }
  #loginBox .field { margin-bottom: 12px; }
  #loginBox .row { display: flex; gap: 8px; }
  #loginBox .row button { flex-shrink: 0; }
  #loginMsg { font-size: 12.5px; margin-top: 10px; min-height: 1em; }
  #loginMsg.error { color: #b42323; }
  #loginMsg.ok { color: #1a7f37; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    #state, .card, #loginBox { background: #1a1a1a; border-color: #2a2a2a; }
    #state.error { background: #2a1515; border-color: #5a2323; color: #ff8a8a; }
    th { color: #888; }
    th, td { border-bottom-color: #262626; }
    button, input { background: #1a1a1a; border-color: #333; color: #eee; }
    #loginMsg.error { color: #ff8a8a; }
    #loginMsg.ok { color: #5fd985; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Аналитика Carscan</h1>
    <div class="sub" id="ts"></div>
  </div>
  <button id="logoutBtn" hidden onclick="AdminAuth.logout()">Выйти</button>
</div>

<div id="loginBox" hidden>
  <h2>Вход для администратора</h2>
  <div class="hint">Код придёт на почту, привязанную к админ-доступу.</div>

  <div id="emailStep">
    <div class="field"><input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email"></div>
    <button id="sendCodeBtn" onclick="AdminAuth.sendCode()">Получить код</button>
  </div>

  <div id="codeStep" hidden>
    <div class="field"><input id="loginCode" type="text" inputmode="numeric" placeholder="Код из письма" autocomplete="one-time-code"></div>
    <div class="row">
      <button id="verifyBtn" onclick="AdminAuth.verifyCode()">Войти</button>
      <button onclick="AdminAuth.resetToEmail()">Изменить email</button>
    </div>
  </div>

  <div id="loginMsg"></div>
</div>

<div id="state" hidden></div>
<div class="grid" id="grid"></div>

<script>
var AdminAuth = (function () {
  function getToken() { try { return localStorage.getItem('ao_session'); } catch (e) { return null; } }
  function setToken(t) { try { localStorage.setItem('ao_session', t); } catch (e) {} }
  function clearToken() { try { localStorage.removeItem('ao_session'); } catch (e) {} }

  function setLoginMsg(text, kind) {
    var el = document.getElementById('loginMsg');
    el.textContent = text || '';
    el.className = kind || '';
  }

  function showLogin() {
    document.getElementById('loginBox').hidden = false;
    document.getElementById('logoutBtn').hidden = true;
    document.getElementById('state').hidden = true;
    document.getElementById('grid').innerHTML = '';
    document.getElementById('ts').textContent = '';
  }

  function resetToEmail() {
    document.getElementById('emailStep').hidden = false;
    document.getElementById('codeStep').hidden = true;
    setLoginMsg('', '');
  }

  async function sendCode() {
    var email = document.getElementById('loginEmail').value.trim();
    if (!email) { setLoginMsg('Введите email', 'error'); return; }
    var btn = document.getElementById('sendCodeBtn');
    btn.disabled = true;
    setLoginMsg('Отправляем код…', '');
    try {
      var res = await fetch('/api/auth/send-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        setLoginMsg(data.detail || 'Не удалось отправить код', 'error');
        btn.disabled = false;
        return;
      }
      document.getElementById('emailStep').hidden = true;
      document.getElementById('codeStep').hidden = false;
      document.getElementById('loginCode').focus();
      setLoginMsg('Код отправлен на ' + email, 'ok');
    } catch (e) {
      setLoginMsg('Сеть недоступна: ' + e.message, 'error');
    }
    btn.disabled = false;
  }

  async function verifyCode() {
    var email = document.getElementById('loginEmail').value.trim();
    var code = document.getElementById('loginCode').value.trim();
    if (!code) { setLoginMsg('Введите код из письма', 'error'); return; }
    var btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    setLoginMsg('Проверяем код…', '');
    try {
      var res = await fetch('/api/auth/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, code: code })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        setLoginMsg(data.detail || 'Неверный или устаревший код', 'error');
        btn.disabled = false;
        return;
      }
      setToken(data.token);
      setLoginMsg('', '');
      Dashboard.load();
    } catch (e) {
      setLoginMsg('Сеть недоступна: ' + e.message, 'error');
    }
    btn.disabled = false;
  }

  function logout() {
    var token = getToken();
    if (token) {
      fetch('/api/auth/logout', { method: 'POST', headers: { 'x-session-token': token } }).catch(function () {});
    }
    clearToken();
    showLogin();
  }

  return { getToken: getToken, clearToken: clearToken, showLogin: showLogin,
           resetToEmail: resetToEmail, sendCode: sendCode, verifyCode: verifyCode, logout: logout };
})();

var Dashboard = (function () {
  function renderTable(rows) {
    if (!rows || !rows.length) return '<div class="empty">Нет данных</div>';
    var cols = Object.keys(rows[0]);
    var html = '<table><thead><tr>';
    cols.forEach(function (c) { html += '<th>' + c + '</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach(function (row) {
      html += '<tr>';
      cols.forEach(function (c) {
        var v = row[c];
        if (v === null || v === undefined) v = '—';
        html += '<td>' + String(v) + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function setState(html, isError) {
    var el = document.getElementById('state');
    el.innerHTML = html;
    el.className = isError ? 'error' : '';
    el.hidden = !html;
  }

  async function load() {
    var token = AdminAuth.getToken();
    if (!token) { AdminAuth.showLogin(); return; }

    document.getElementById('loginBox').hidden = true;
    document.getElementById('logoutBtn').hidden = false;
    setState('Загрузка…', false);

    var res;
    try {
      res = await fetch('/api/admin/analytics', { headers: { 'x-session-token': token } });
    } catch (e) {
      setState('Не удалось связаться с сервером: ' + e.message, true);
      return;
    }

    if (res.status === 403) {
      AdminAuth.clearToken();
      AdminAuth.showLogin();
      AdminAuth.resetToEmail();
      document.getElementById('loginMsg').textContent = 'Этот аккаунт не имеет прав администратора.';
      document.getElementById('loginMsg').className = 'error';
      return;
    }
    if (!res.ok) {
      setState('Ошибка сервера: ' + res.status, true);
      return;
    }

    var data = await res.json();
    setState('', false);
    document.getElementById('ts').textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    (data.sections || []).forEach(function (section) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h2>' + section.title + '</h2>' + renderTable(section.rows);
      grid.appendChild(card);
    });
  }

  return { load: load };
})();

Dashboard.load();
</script>

</body>
</html>
