<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Carscan — Аналитика</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafafa; color: #1a1a1a;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  #state { padding: 16px; border-radius: 8px; background: #fff; border: 1px solid #eee; max-width: 480px; }
  #state.error { border-color: #f5c2c2; background: #fff5f5; color: #b42323; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
  .card {
    background: #fff; border: 1px solid #eee; border-radius: 10px;
    padding: 16px; overflow-x: auto;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #f0f0f0; }
  th { color: #888; font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .empty { color: #aaa; font-size: 13px; padding: 8px 0; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    #state, .card { background: #1a1a1a; border-color: #2a2a2a; }
    #state.error { background: #2a1515; border-color: #5a2323; color: #ff8a8a; }
    th { color: #888; }
    th, td { border-bottom-color: #262626; }
    button { background: #1a1a1a; border-color: #333; color: #eee; }
  }
</style>
</head>
<body>

<h1>Аналитика Carscan</h1>
<div class="sub" id="ts"></div>

<div id="state"></div>
<div class="grid" id="grid"></div>

<script>
(function () {
  function getSessionToken() {
    try { return localStorage.getItem('ao_session'); } catch (e) { return null; }
  }

  function renderTable(rows) {
    if (!rows || !rows.length) {
      return '<div class="empty">Нет данных</div>';
    }
    var cols = Object.keys(rows[0]);
    var html = '<table><thead><tr>';
    cols.forEach(function (c) { html += '<th>' + c + '</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach(function (row) {
      html += '<tr>';
      cols.forEach(function (c) {
        var v = row[c];
        if (v === null || v === undefined) v = '—';
        html += '<td>' + String(v) + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function setState(html, isError) {
    var el = document.getElementById('state');
    el.innerHTML = html;
    el.className = isError ? 'error' : '';
    el.style.display = html ? 'block' : 'none';
  }

  async function load() {
    var token = getSessionToken();
    if (!token) {
      setState('Вы не авторизованы. <a href="/">Войдите на сайте</a> под админ-аккаунтом и вернитесь на эту страницу.', true);
      return;
    }

    setState('Загрузка…', false);

    let res;
    try {
      res = await fetch('/api/admin/analytics', {
        headers: { 'x-session-token': token }
      });
    } catch (e) {
      setState('Не удалось связаться с сервером: ' + e.message, true);
      return;
    }

    if (res.status === 403) {
      setState('Доступ запрещён — эта страница только для админ-аккаунта.', true);
      return;
    }
    if (!res.ok) {
      setState('Ошибка сервера: ' + res.status, true);
      return;
    }

    var data = await res.json();
    setState('', false);
    document.getElementById('ts').textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    (data.sections || []).forEach(function (section) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h2>' + section.title + '</h2>' + renderTable(section.rows);
      grid.appendChild(card);
    });
  }

  load();
})();
</script>

</body>
</html>
